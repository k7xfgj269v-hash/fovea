[package]
name = "guest-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "靶机侧 agent（不可信侧）：MCP front + 内省引擎 + 探针 manager + 飞行记录 + 写侧。"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
introspect-schema.workspace = true

# §13.1「这是最重要的库选择」。M1 第二刀接 ELF 符号化：
#   - `dwarf` 优先 DWARF 命中（拉到 SymbolConfidence::Dwarf 那档）
#   - `demangle` 把 C++/Rust 名字解 mangling
# 不要的：apk/breakpad/gsym 暂无用、zlib 等压缩留到 M4 飞行记录。
# Mac 上 `default-features=false` pure-Rust 编译通过、零系统库依赖。
blazesym = { version = "0.2", default-features = false, features = ["dwarf", "demangle"] }

[lib]
name = "guest_agent"
path = "src/lib.rs"

[[bin]]
name = "guest-agent"
path = "src/bin/guest_agent.rs"
