name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: M1 gates (Ubuntu, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: License declarations
        run: scripts/ci/check-licenses.sh

      - name: cargo check
        run: cargo check --locked --all-targets --all-features

      - name: cargo test
        run: cargo test --locked --all

      - name: D7 Linux live acceptance
        run: cargo test --locked -p guest-agent --test d7_linux_live -- --ignored --nocapture --test-threads=1

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  macos:
    name: Portable tests (macOS, stable)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (portable cfg paths)
        run: cargo test --locked --all
