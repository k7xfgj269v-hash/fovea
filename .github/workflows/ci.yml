name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: check · test (ubuntu, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # First real compilation. On ubuntu this reaches the
      # #[cfg(target_os = "linux")] paths (BlazeSymbolizer, the real /proc I/O)
      # that always cfg-out on Mac and have never been compiled.
      - name: cargo check (all targets)
        run: cargo check --all-targets --all-features

      - name: cargo test
        run: cargo test --all

      # Style checks. The AI-written code has not been fmt/clippy'd yet, so these
      # do not gate the build for now — drop `continue-on-error` once tidied.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all --check

      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --all-targets --all-features
